[package]
name = "ofd-quicklook"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native macOS Quick Look renderer for OFD files: image-based preview PDF and thumbnail PNG behind a frozen C ABI."

[lib]
name = "ofd_quicklook"
crate-type = ["staticlib", "rlib"]

[dependencies]
ofd-core = { path = "../ofd-core" }
fontdb = { workspace = true, features = ["fs", "memmap", "fontconfig"] }
image.workspace = true
printpdf = { version = "0.12.5", default-features = false, features = ["jpeg"] }

[dev-dependencies]
printpdf = { version = "0.12.5", default-features = false, features = ["jpeg"] }
