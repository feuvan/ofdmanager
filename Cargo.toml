[workspace]
resolver = "2"
members = [
    "crates/ofd-core",
    "crates/ofd-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/feuvan/ofdmanager"

[workspace.dependencies]
# Container / XML
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
# Fonts & text
ttf-parser = "0.24"
fontdb = "0.21"
rustybuzz = "0.18"
# Rasterizer
tiny-skia = "0.11"
# Images
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
justbig2 = "0.2"
# Crypto (signature digest verification — GM SM3 etc.)
sm3 = "0.4"
sha2 = "0.10"
md-5 = "0.10"
digest = "0.10"
base64 = "0.22"
# Errors / utils
thiserror = "1"
log = "0.4"
